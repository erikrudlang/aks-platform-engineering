apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simpleapplication3
  namespace: argocd
  labels:
    environment: production
    component: simpleapplication3
spec:
  project: default
  source:
    repoURL: https://github.com/erikrudlang/simpleapplication3-manifests.git
    targetRevision: main
    path: production
  destination:
    server: https://kubernetes.default.svc
    namespace: simpleapplication3-production
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
