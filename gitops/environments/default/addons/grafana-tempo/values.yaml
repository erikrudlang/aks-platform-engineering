storage:
  trace:
    backend: azure
    azure:
      container_name: tempo-traces
      storage_account_name: staksdemo
      storage_account_key: "secret-here"

# Enable OTLP receivers
traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

distributor:
  extraArgs:
    - "-config.expand-env=true"
  extraEnv:
    - name: STORAGE_ACCOUNT_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: tempo-traces-stg-key
          key: tempo-traces-key

blockBuilder:
  extraArgs:
    - "-config.expand-env=true"
  extraEnv:
    - name: STORAGE_ACCOUNT_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: tempo-traces-stg-key
          key: tempo-traces-key

