---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector-sa
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-role
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["apps"]
    resources:
      - replicasets
      - deployments
      - daemonsets
      - statefulsets
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-role
subjects:
  - kind: ServiceAccount
    name: otel-collector-sa
    namespace: argocd
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: argocd-log-collector
  namespace: argocd
spec:
  serviceAccount: otel-collector-sa
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.151.0
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  config:
    receivers:
      # Receive OTLP traces and logs
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Scrape Prometheus metrics from ArgoCD components
      # prometheus:
      #   config:
      #     scrape_configs:
      #       - job_name: "argocd-server"
      #         scrape_interval: 30s
      #         kubernetes_sd_configs:
      #           - role: pod
      #             namespaces:
      #               names: [argocd]
      #         relabel_configs:
      #           - source_labels:
      #               [__meta_kubernetes_pod_label_app_kubernetes_io_name]
      #             regex: argocd-server
      #             action: keep
      #           - source_labels: [__meta_kubernetes_pod_ip]
      #             target_label: __address__
      #             replacement: "$1:8083"

      #       - job_name: "argocd-repo-server"
      #         scrape_interval: 30s
      #         kubernetes_sd_configs:
      #           - role: pod
      #             namespaces:
      #               names: [argocd]
      #         relabel_configs:
      #           - source_labels:
      #               [__meta_kubernetes_pod_label_app_kubernetes_io_name]
      #             regex: argocd-repo-server
      #             action: keep
      #           - source_labels: [__meta_kubernetes_pod_ip]
      #             target_label: __address__
      #             replacement: "$1:8084"

      #       - job_name: "argocd-application-controller"
      #         scrape_interval: 30s
      #         kubernetes_sd_configs:
      #           - role: pod
      #             namespaces:
      #               names: [argocd]
      #         relabel_configs:
      #           - source_labels:
      #               [__meta_kubernetes_pod_label_app_kubernetes_io_name]
      #             regex: argocd-application-controller
      #             action: keep
      #           - source_labels: [__meta_kubernetes_pod_ip]
      #             target_label: __address__
      #             replacement: "$1:8082"
      # filelog:
      #   include:
      #     - /var/log/pods/argocd_*/*/*.log
      #   start_at: end
      #   include_file_path: true
      #   include_file_name: false
      #   operators:
      #     - type: container

    processors:
      resource:
        attributes:
          - key: k8s.namespace.name
            value: argocd
            action: upsert
      batch:
        send_batch_size: 500
        timeout: 5s

      filter:
        metrics:
          exclude:
            match_type: strict
            metric_names:
              - go_memstats_alloc_bytes_total

    exporters:
      otlphttp/prometheus-remote:
        endpoint: http://prometheus-primary-kube-pr-prometheus.monitoring.svc.cluster.local:9090/api/v1/otlp
        tls:
          insecure: true
      otlp/tempo:
        endpoint: grafana-tempo-distributor.monitoring.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://loki-primary-gateway.monitoring.svc.cluster.local/otlp
        tls:
          insecure: true
        headers:
          X-Scope-OrgID: "1"

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [resource, filter, batch]
          exporters: [otlphttp/prometheus-remote]
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlphttp/loki]
