---
# Global Prometheus with Thanos Query for multicluster monitoring
prometheus:
  prometheusSpec:
    # Enable remote write receiver for edge clusters
    enableRemoteWriteReceiver: true
    
    # Retention settings
    retention: 15d
    retentionSize: "50GB"
    
    # Storage configuration
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi
    
    # Thanos configuration for global queries
    thanos:
      # Thanos sidecar disabled on global (acts as query frontend)
      enabled: false
    
    # Remote write target for edge clusters (optional if using Thanos)
    remoteWrite: []
    
    # Resource limits
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 8Gi

# Thanos Query component - aggregates metrics from all edge clusters
thanos:
  enabled: true
  
  # Thanos Query configuration
  query:
    enabled: true
    replicaCount: 2
    
    # Stores to query (edge Prometheus instances)
    stores:
      # Add edge cluster Prometheus stores here
      # Example: - "prometheus-edge.monitoring.svc.cluster-1.local:10901"
      []
    
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  
  # Thanos Query Frontend (optional, for caching and query splitting)
  queryFrontend:
    enabled: true
    replicaCount: 2
    
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  
  # Thanos Ruler for global alerting rules
  ruler:
    enabled: true
    replicaCount: 2
    
    # Alert managers
    alertmanagers:
      - http://prometheus-global-alertmanager.monitoring.svc.cluster.local:9093
    
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  
  # Thanos Store Gateway for object storage (if using long-term storage)
  storeGateway:
    enabled: false
    # Enable if using Azure Blob Storage for long-term metrics
    # replicaCount: 2
  
  # Thanos Compactor for object storage compaction
  compactor:
    enabled: false
    # Enable if using object storage
    # retentionResolutionRaw: 30d
    # retentionResolution5m: 90d
    # retentionResolution1h: 180d

# Grafana configuration
grafana:
  enabled: true
  
  adminPassword: "changeme"
  
  # Data sources
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Thanos
          type: prometheus
          url: http://thanos-query.monitoring.svc.cluster.local:9090
          access: proxy
          isDefault: true
        - name: Prometheus-Global
          type: prometheus
          url: http://prometheus-global-prometheus.monitoring.svc.cluster.local:9090
          access: proxy
  
  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Alertmanager configuration
alertmanager:
  enabled: true
  
  alertmanagerSpec:
    replicas: 3
    
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# Disable components not needed on global
kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

prometheusOperator:
  enabled: true
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
