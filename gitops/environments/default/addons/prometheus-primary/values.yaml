grafana:
  enabled: false

alertmanager:
  enabled: false

prometheus:
  enabled: false
  externalLabels:
    cluster: primary
    prometheus: primary
    prometheus_replica: $(POD_NAME)
    # Enable replicaLabel for deduplication
  replicaExternalLabelName: prometheus_replica
  prometheusExternalLabelName: prometheus
  thanosService:
    enabled: true
  prometheusSpec:
    otlp:
      keepIdentifyingResourceAttributes: true
      promoteResourceAttributes:
        - service.instance.id
        - service.name
        - service.namespace
        - service.version
        - cloud.availability_zone
        - cloud.region
        - container.name
        - deployment.environment
        - deployment.environment.name
        - k8s.cluster.name
        - k8s.container.name
        - k8s.cronjob.name
        - k8s.daemonset.name
        - k8s.deployment.name
        - k8s.job.name
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.replicaset.name
        - k8s.statefulset.name
        - k8s.node.name
        - k8s.pod.uid
        - k8s.pod.start_time
    additionalArgs:
      - name: web.enable-otlp-receiver
        value: ""
    thanos:
      objectStorageConfig:
        existingSecret:
          name: thanos-config
          key: objstore.yml
    resources:
      # Set appropriate resource constraints
      limits:
        cpu: 1000m
        memory: 4Gi
      requests:
        cpu: 100m
        memory: 250Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              # Configure the PVC size for the deployment
              storage: 8Gi
