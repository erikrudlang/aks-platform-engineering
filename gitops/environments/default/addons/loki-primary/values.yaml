loki:
  limitsConfig:
    # Allow OTLP log ingestion
    allow_structured_metadata: true
    # Maximum log line size in bytes
    max_line_size: 256000
    # Retention period for logs
    retention_period: 720h
    otlp_config:
      resource_attributes:
        ignore_defaults: true
        attributes_config:
          - action: index_label
            regex: service.group
  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  ingester:
    chunk_encoding: snappy

  memcached:
    chunk_cache:
      enabled: false
    results_cache:
      enabled: false
  storage:
    type: azure
    azure:
      # Name of the Azure Blob Storage account
      accountName: staksdemo
      # Key associated with the Azure Blob Storage account
      accountKey: <your-account-key>
      # Flag indicating whether to use Azure Managed Identity for authentication
      useManagedIdentity: false
      # Flag indicating whether to use a federated token for authentication
      useFederatedToken: false
      # Domain suffix of the Azure Blob Storage service endpoint (e.g., core.windows.net)
      endpointSuffix: core.windows.net
    bucketNames:
      chunks: "aks-demo-loki-chunks"
      ruler: "aks-demo-loki-ruler"
      admin: "aks-demo-loki-admin"

deploymentMode: Monolithic

# Disable cache deployments
chunksCache:
  enabled: false
resultsCache:
  enabled: false

singleBinary:
  replicas: 1

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
