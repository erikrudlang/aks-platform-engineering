loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    max_cache_freshness_per_query: 10m
    query_timeout: 300s
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    split_queries_by_interval: 15m
    volume_enabled: true

# Deploy as single binary instead of microservices
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources: {}
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            {{- include "loki.singleBinaryLabels" . | nindent 10 }}
        topologyKey: kubernetes.io/hostname

# Disable microservices components
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

serviceAccount:
  create: true
  name: loki
  automountServiceAccountToken: true

# Disable gateway
gateway:
  enabled: false

# Disable ingress
ingress:
  enabled: false

# Disable testing and monitoring
test:
  enabled: false
monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  serviceMonitor:
    enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false

# Enable sidecar for rules
sidecar:
  rules:
    enabled: true
    label: loki_rule
    folder: /rules
    resource: both
    watchMethod: WATCH