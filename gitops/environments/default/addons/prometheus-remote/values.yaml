grafana:
  enabled: true

alertmanager:
  enabled: true

prometheus:
  externalLabels:
      cluster: primary
      prometheus: primary
      prometheus_replica: $(POD_NAME)
    # Enable replicaLabel for deduplication
  replicaExternalLabelName: prometheus_replica
  prometheusExternalLabelName: prometheus
  thanosService:
    enabled: true
  prometheusSpec:
      # Enable OTLP receiver feature flag
    enableFeatures:
      - otlp-write-receiver
    
    # Configure additional ports for OTLP
    additionalPorts:
      - name: otlp-http
        containerPort: 9091  # OTLP uses the same port as Prometheus
        protocol: TCP
    thanos:
      objectStorageConfig:
        existingSecret:
          name: thanos-config
          key: objstore.yml
    resources:
      # Set appropriate resource constraints
      limits:
        cpu: 1000m
        memory: 4Gi
      requests:
        cpu: 100m
        memory: 250Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              # Configure the PVC size for the deployment
              storage: 8Gi



