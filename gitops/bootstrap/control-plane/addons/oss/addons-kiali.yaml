---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-testing
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        values:
          addonChartVersion: 0.2.0
          addonRepoUrl: oci://acraksdemo.azurecr.io/helm/nginx-deployment
        selector:
          matchLabels:
            environment: control-plane

  template:
    metadata:
      name: addon-testing
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - repoURL: '{{values.addonRepoUrl}}'
          path: .
          targetRevision: '{{values.addonChartVersion}}'
      destination:
        namespace: aspireapp
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
