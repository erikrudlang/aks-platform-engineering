---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-prometheus-remote
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    - clusters:
        values:
          addonChart: kube-prometheus-stack
          addonChartVersion: "84.5.0"
          addonChartRepository: https://prometheus-community.github.io/helm-charts
        selector:
          matchExpressions:
            - key: enable_prometheus
              operator: In
              values: ["true"]
  template:
    metadata:
      name: addon-{{name}}-prometheus-remote
    spec:
      project: default
      sources:
        - repoURL: "{{metadata.annotations.addons_repo_url}}"
          targetRevision: "{{metadata.annotations.addons_repo_revision}}"
          ref: values
        # Deploy custom ConfigMap first
        - repoURL: "{{metadata.annotations.addons_repo_url}}"
          targetRevision: "{{metadata.annotations.addons_repo_revision}}"
          path: "{{metadata.annotations.addons_repo_basepath}}environments/default/addons/prometheus-remote"
          directory:
            include: "prometheus-config.yaml"
        - chart: "{{values.addonChart}}"
          repoURL: "{{values.addonChartRepository}}"
          targetRevision: "{{values.addonChartVersion}}"
          helm:
            releaseName: "prometheus-remote"
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/prometheus-remote/values.yaml
      destination:
        namespace: monitoring
        name: "{{name}}"
      syncPolicy:
        automated:
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
