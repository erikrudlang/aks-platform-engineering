---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-prometheus-remote
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  # deploy prometheus with thanos sidecar to all tenants in all workload clusters
  generators:
    # matrix 'parent' generator
    - matrix:
        generators:
          # git generator, 'child' #1
          - git:
              repoURL: https://github.com/erikrudlang/aks-platform-engineering
              revision: main
              directories:
                - path: ./gitops/apps/development'
          # cluster generator, 'child' #2
          - clusters:
              values:
                addonChart: prometheus
                addonChartVersion: 29.6.0
                addonChartRepository: https://prometheus-community.github.io/helm-charts
              selector:
                matchExpressions:
                  - key: environment
                    operator: NotIn
                    values: ['control-plane']
                  - key: enable_prometheus
                    operator: In
                    values: ['true']
  template:
    metadata:
      name: addon-{{.path.basename}}-{{.name}}-prometheus-remote
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: 'prometheus-remote'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/prometheus-remote/values.yaml
      destination:
        namespace: '{{.path.basename}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
