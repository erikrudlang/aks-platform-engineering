---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-loki
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        values:
          addonChart: loki
          addonChartVersion: 7.0.0
          addonChartRepository: https://grafana.github.io/helm-charts
        selector:
          matchLabels:
            environment: control-plane

  template:
    metadata:
      name: addon-{{name}}-loki
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: 'loki-primary'
            ignoreMissingValueFiles: true
            values: |
              storage_config:
                object_store:
                  azure:
                    account_key: {{metadata.annotations.azure_account_key}}
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/loki-primary/values.yaml
      destination:
        namespace: monitoring
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
