---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-prometheus-primary
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  # deploy prometheus, grafana, 

  generators:
    - clusters:
        values:
          addonChart: kube-prometheus-stack
          addonChartVersion: '{{metadata.labels.prometheus_chart_version}}'
          addonChartRepositoryNamespace: monitoring
          addonChartRepository: https://prometheus-community.github.io/helm-charts
        selector:
          matchLabels:
            environment: control-plane
  template:
    metadata:
      name: addon-{{.name}}'-prometheus-primary
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: 'prometheus-primary'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/prometheus-primary/values.yaml
      destination:
        namespace: '{{values.addonChartRepositoryNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
