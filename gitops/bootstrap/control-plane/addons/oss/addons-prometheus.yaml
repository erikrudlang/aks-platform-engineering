---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-prometheus
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  # deploy prometheus with thanos sidecar to all tenants in all workload clusters
  generators:
    # matrix 'parent' generator
    - matrix:
        generators:
          # git generator, 'child' #1
          - git:
              repoURL: '{{metadata.annotations.addons_repo_url}}'
              revision: HEAD
              directories:
                - path: '{{metadata.annotations.addons_repo_basepath}}apps/development'
          # cluster generator, 'child' #2
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
  generators:
    - clusters:
        values:
          addonChart: kube-prometheus-stack
          addonChartVersion: '{{metadata.labels.prometheus_chart_version}}'
          addonChartRepositoryNamespace: monitoring
          addonChartRepository: https://prometheus-community.github.io/helm-charts
        selector:
          matchLabels:
            environment: control-plane
  template:
    metadata:
      name: addon-'{{.path.basename}}-{{.name}}'-prometheus
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: 'prometheus'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/prometheus/values.yaml
      destination:
        namespace: '{{.path.basename}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
