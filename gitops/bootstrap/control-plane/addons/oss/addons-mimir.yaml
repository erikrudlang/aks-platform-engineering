---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-mimir
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        values:
          addonChart: mimir-distributed
          addonChartVersion: 6.0.6
          addonChartRepository: https://grafana.github.io/helm-charts
        selector:
          matchLabels:
            environment: control-plane-xxx

  template:
    metadata:
      name: addon-{{name}}-mimir
    spec:
      project: default
      sources:
        - repoURL: "{{metadata.annotations.addons_repo_url}}"
          targetRevision: "{{metadata.annotations.addons_repo_revision}}"
          ref: values
        - chart: "{{values.addonChart}}"
          repoURL: "{{values.addonChartRepository}}"
          targetRevision: "{{values.addonChartVersion}}"
          helm:
            releaseName: "mimir-primary"
            ignoreMissingValueFiles: true
            values: |
              mimir:
                structuredConfig:
                  common:
                    storage:
                      azure:
                        account_key: {{metadata.annotations.azure_account_key}}
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/mimir-primary/values.yaml
      destination:
        namespace: monitoring
        name: "{{name}}"
      syncPolicy:
        automated:
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
