---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-grafana-tempo
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    - clusters:
        values:
          addonChart: tempo-distributed
          addonChartVersion: "2.19.0"
          addonChartRepository: https://grafana-community.github.io/helm-charts
        selector:
          matchExpressions:
            - key: enable_grafana_tempo
              operator: In
              values: ["true"]
  template:
    metadata:
      name: addon-{{name}}-grafana-tempo
    spec:
      project: default
      sources:
        - repoURL: "{{metadata.annotations.addons_repo_url}}"
          targetRevision: "{{metadata.annotations.addons_repo_revision}}"
          ref: values
        - chart: "{{values.addonChart}}"
          repoURL: "{{values.addonChartRepository}}"
          targetRevision: "{{values.addonChartVersion}}"
          helm:
            releaseName: "grafana-tempo"
            ignoreMissingValueFiles: true
            values: |
              storage:
                trace:
                  azure:
                    storage_account_name: {{metadata.annotations.azure_account_key}}
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/grafana-tempo/values.yaml
            parameters:
              - name: tempoTracesKey
                value: "{{metadata.annotations.azure_account_key}}"
              - name: extraObjects[0].apiVersion
                value: "v1"
              - name: extraObjects[0].kind
                value: "Secret"
              - name: extraObjects[0].metadata.name
                value: "tempo-traces-stg-key"
              - name: extraObjects[0].metadata.namespace
                value: "monitoring"
              - name: extraObjects[0].type
                value: "Opaque"
              - name: extraObjects[0].stringData.tempo-traces-key
                value: "{{metadata.annotations.azure_account_key}}"

      destination:
        namespace: monitoring
        name: "{{name}}"
      syncPolicy:
        automated:
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
