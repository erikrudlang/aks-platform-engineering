---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-otel-collector
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        values:
          addonChartVersion: 0.2.0
          addonRepoUrl: oci://acraksdemo.azurecr.io/helm/otel-dotnet-sidecar
        selector:
          matchExpressions:
            - key: enable_otel_operator
              operator: In
              values: ['true']

  template:
    metadata:
      name: addon-{{name}}-otel-dotnet-sidecar
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - repoURL: '{{values.addonRepoUrl}}'
          path: .
          targetRevision: '{{values.addonChartVersion}}'
      destination:
        namespace: aspireapp
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
