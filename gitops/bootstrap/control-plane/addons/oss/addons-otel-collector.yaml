---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-otel-collector
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        values:
          addonChart: otel-dotnet-sidecar
          addonChartVersion: 0.1.0
          addonChartRepository: acraksdemo.azurecr.io/helm
        selector:
          matchExpressions:
            - key: enable_otel_operator
              operator: In
              values: ['true']

  template:
    metadata:
      name: addon-{{name}}-otel-dotnet-sidecar
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: 'otel-dotnet-sidecar'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/otel-dotnet-sidecar/values.yaml
      destination:
        namespace: aspireapp
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
